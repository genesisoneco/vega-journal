<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark" aria-hidden="true">V</span>
      <span class="brand__text">Vega<span class="brand__sub">market diary</span></span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      {%- for item in site.data.navigation -%}
        {%- assign cur = page.url | remove_first: site.baseurl -%}
        <a href="{{ item.url | relative_url }}"
           class="site-nav__link{% if item.cta %} site-nav__link--cta{% endif %}{% if cur == item.url %} is-active{% endif %}">{{ item.title }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
