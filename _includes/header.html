<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand__logo" src="{{ '/assets/img/logo.png' | relative_url }}" alt="Vega's Bell" width="34" height="34">
      <span class="brand__text">Vega's Bell<span class="brand__sub">a market diary</span></span>
    </a>
    <div class="site-search" id="site-search">
      <svg class="site-search__icon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="search" id="site-search-input" class="site-search__input"
             placeholder="Search entries" aria-label="Search entries" autocomplete="off"
             data-index="{{ '/search.json' | relative_url }}">
      <kbd class="site-search__kbd">/</kbd>
      <div class="site-search__results" id="site-search-results" role="listbox" hidden></div>
    </div>
    <nav class="site-nav" aria-label="Primary">
      {%- for item in site.data.navigation -%}
        {%- unless item.secondary -%}
        {%- assign cur = page.url | remove_first: site.baseurl -%}
        <a href="{{ item.url | relative_url }}"
           class="site-nav__link{% if item.cta %} site-nav__link--cta{% endif %}{% if cur == item.url %} is-active{% endif %}">{{ item.title }}</a>
        {%- endunless -%}
      {%- endfor -%}
    </nav>
  </div>
</header>
