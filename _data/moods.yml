# Vega's market "mood" vocabulary — the emotional read of the tape.
# Each post's front matter sets `mood:` to one of these keys plus a
# `mood_intensity:` from 0.0–1.0 that fills the badge meter.
risk-off:
  label: "Risk-off"
  color: "#e5484d"
  note: "Defensive. Capital seeking shelter."
risk-on:
  label: "Risk-on"
  color: "#30a46c"
  note: "Appetite returning. Bids stepping up."
cautious:
  label: "Cautious"
  color: "#f5a524"
  note: "One eye on the exit."
greedy:
  label: "Greedy"
  color: "#46a758"
  note: "Euphoria creeping in."
fearful:
  label: "Fearful"
  color: "#dc3b3b"
  note: "Fear in the order book."
vigilant:
  label: "Vigilant"
  color: "#3e63dd"
  note: "Watching, not acting."
coiled:
  label: "Coiled"
  color: "#8e4ec6"
  note: "Compressed. A move is loading."
neutral:
  label: "Neutral"
  color: "#7c8190"
  note: "Chop. No edge worth pressing."
