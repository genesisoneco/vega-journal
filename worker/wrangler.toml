# Vega API Worker — deploy with:  npx wrangler deploy
#
# One-time setup (see docs/cloudflare-setup.md):
#   npx wrangler login
#   npx wrangler kv namespace create KV      # paste the printed id below
#   npx wrangler secret put TURNSTILE_SECRET
#   npx wrangler secret put ADMIN_TOKEN
name = "vega-api"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

# Public origin(s) allowed to call the API (scheme + host only, no path).
# Comma-separated list; localhost is always allowed for local dev.
# First entry is the canonical site base (used in emails / confirm pages).
[vars]
ALLOWED_ORIGIN = "https://vegabell.com,https://www.vegabell.com,https://genesisoneco.github.io"
SITE_BASE = "https://vegabell.com"
# From-address for outgoing email (not secret). BREVO_API_KEY is a secret:
#   cd worker && npx wrangler secret put BREVO_API_KEY
VEGA_FROM_EMAIL = "Vega's Bell <vega@vegabell.com>"

# KV namespace. Create it with `wrangler kv namespace create KV` and paste the id.
[[kv_namespaces]]
binding = "KV"
id = "19dc3872a80e421286aa2a90e99a20f5"

# Secrets are NOT stored here. Set them with `wrangler secret put`:
#   TURNSTILE_SECRET  — Turnstile widget secret key
#   ADMIN_TOKEN       — long random string; the responder/notify scripts send it
